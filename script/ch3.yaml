  跨线时序:
    1. CH1聊完（在家）→ 章间上下文重置（阅后即焚）→ 路途时间
    2. 男生先到（3.1.1）→ 攀谈线耳机事件（3.2.1）→ 停住
    3. 女生出地铁站（3.4.1，等男生到店旗标）→ 确认地址（含瞎指路吐槽支线）
    4. 过段时间（她走路，ARTX闲聊即路途戏）→ 男生看到女生（3.2.2/3.3.1，等女生3.4.1完成）
    5. 两线各自汇入第四幕
  引擎落法: 到店选择set「到店」旗标；3.4.1 when到店；3.2.2/3.3.1 requires [3.4.1]
  教学闭环: 女窗「店的位置」存于CH1→3.4.1置灰门；男窗「我妹的同桌」存于3.2.2/3.3.1→第四幕4.2.2表妹门
  收束说明: 路线分叉（攀谈/手机）与问路分叉（精确/瞎指）均在幕内收束，不影响出口
