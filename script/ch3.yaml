#   分叉：{选项文字: 子编号}；AI回复与选项一一对应
# 四条规则：①用户消息=角色原话 ②AI思考=DeepSeek式自言自语两三句30~40字
#   ③选项=短语AI自言自语态度 ④AI回复=像人但带AI味一两句
# 世界观：AI聊天记录阅后即焚，只有玩家主动存的记忆才留得住。
#
# —— 旧编号映射（口述稿→本稿）——
#   旧CH2 L4-{时光/心动/叙事者} → 3.1.1-{A/B/C}
#   旧11耳机 → 3.2.1；旧111看到女生 → 3.2.2；旧1111口嗨 → 3.2.3；旧1112怂恿 → 3.2.4
#   旧21看到女生 → 3.3.1；旧211口嗨 → 3.3.2
#   女：旧1问路 → 3.4.1；新增瞎指路吐槽拍 3.4.2【发挥】；旧11ARTX → 3.4.3；旧111随便问问 → 3.4.4
#   旧标签「用户觉得衣服贵」随ARTX候选一并撤除，仅留台词纹理。
#
# —— 接口 ——
#   入场：男生=CH1的shop旗标（三变体）；女生=CH1收线后开始
#   出口：男生线两路收线；女生线收线；均汇入第四幕
#   教学点：男窗=3.2.2/3.3.1存「我妹的同桌」→第四幕表妹门
