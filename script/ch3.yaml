# 设计稿：合并重写自旧CH2+CH3口述稿，②③④按四条规则补全，①保留口述原文。
#
# —— 统一格式规范（与 ch5.yaml 一致，全剧本从此统一）——
# 字段：编号/所属/标题/入场?/等待?/用户消息/AI思考/选项/AI回复/分叉?/下一?/终局?/记忆候选?/备注?
