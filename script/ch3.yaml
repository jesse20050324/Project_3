# ============================================================
# CH3 剧本草稿 · 纯剧本工作区（与游戏引擎文件 content/ 无关，定稿后再迁移）
#
# 编号规则（与白板同一套）：
#   每往右一轮编号多一位；上一轮分叉则子轮次补 1 / 2；
#   单一路径默认补 1。男生、女生两条线各自独立编号。
#
# 每轮四条的填写规则：
#   1 用户消息：用户（男生/女生）发的话，原文即成品，沿用。
#   2 AI思考：DeepSeek式自言自语，客观平静的机器感，两三句、30~40字。
#   3 选项：玩家按钮。短语或半句话，AI自言自语的态度感（去掉"我要"）。
#   4 AI回复：发给用户的话。有点像人但带AI味，可偶尔好玩，长短按语境。
#   原文为（常规）= 按语境+基本要求全权补全；
#   原文为（包含）= 保留原意只补细节，尽量少改。
#
# 定稿栏：null = 还没补；有内容 = 当前版本。
# ============================================================

