# ---------- 男生 · 5.1 开场三变体＋慢回初显（真分叉） ----------
- 编号: 5.1.1-A
  所属: 男生
  入场: 双问（男问+女问）
  标题: 开场·双问（互加第二天）
  用户消息: "我妹刚才跟我说，那女生昨天也找她要过我微信！等于是我俩想到一块去了？那第一句我发啥才不显得刻意，你给定个调"
  AI思考: 两边都要过联系方式，用户明显上头。先给能用的开场句，再轻踩一脚别用力过猛。
  选项: [给一句自然的开场]
  AI回复: 互相都惦记，这开局不亏。就发"hi，那天桌游坐我斜对面的"，有记忆点又不刻意。别写小作文，第一个字发出去就赢了。
  下一: 5.1.2

- 编号: 5.1.1-B
  所属: 男生
  入场: 仅男问
  标题: 开场·仅男问（互加第二天）
  用户消息: "微信到手了，我妹牵的线。但我对着输入框抠了半小时了，第一句咋整，总不能发'你好'吧，像上门推销的"
  AI思考: 要到了微信却卡在第一句，紧张大于兴奋。给个具体的句子，顺便把心理负担卸了。
  选项: [给一句自然的开场]
  AI回复: 别"你好"，太像客服。发"hi，桌游那天赢你两把的"，输赢都是梗，她接哪句都顺。发完把手机扣桌上，别盯着。
  下一: 5.1.2

- 编号: 5.1.1-C
  所属: 男生
  入场: 仅女问
  标题: 开场·仅女问（互加第二天）
  用户消息: "反转了兄弟，我还没想好咋开口呢，她直接加我了！是不是我妹泄密了？她这啥意思啊"
  AI思考: 对方主动加好友，超出用户预期。先定性这是好信号，拦住过度脑补。
  选项: [告诉她这是好信号]
  AI回复: 谁泄的密不重要，人家愿意加你就是愿意聊。通过，回个"hi，终于等来你了"都行。主动的一方已经交卷了，你照抄就完事。
  下一: 5.1.2

- 编号: 5.1.2
  所属: 男生
  标题: 慢回初显（第三天）
  用户消息: "我发了！结果她过了四十来分钟才回，就一句'记得，你也要到点睡了'。这算热情还是冷淡啊，我现在不知道咋接"
  AI思考: 用户开始用回复间隔给态度打分了。他贴的原文里关心是明摆着的，先把这个指给他看。
  选项: [稳住，别用回复速度衡量她, 顺着她那句关心接住]
  AI回复:
    - 四十来分钟在成年人世界里就是"刚看到"，别给自己加戏。她那句话的重点在后半截——让你到点睡。回"还没呢，聊上头了"，自然收住。
    - 间隔不是重点，重点是她记得你之前说的话，还叮嘱你睡觉。回"听你的，这就睡"，把这份关心接住，别浪费。
  分叉: {稳住，别用回复速度衡量她: "5.1.3", 顺着她那句关心接住: "5.1.4"}

- 编号: 5.1.3
  所属: 男生
  标题: 稳住一夜（分支A·当晚到次日）
  用户消息: "听你的没追问，就睡前互相道了个晚安。今早她又正常找我聊了两句，好像也没啥事。就是……我这心里空落落的，总觉得少了点啥"
  AI思考: 按兵不动一晚，联系没有断，用户的空落感反而冒头了。点破他要的其实是密度，但不评判。
  选项: [告诉他这是正常的落差]
  AI回复: 没追问不等于失去，节奏换了个挡而已。那点空落，是你还想聊得更多的证据，记着这感觉，别急着用消息去填满。
  下一: 5.2.1

- 编号: 5.1.4
  所属: 男生
  标题: 接住之后（分支B·当晚到次日）
  用户消息: "接住了！顺着她那句聊到十一点多，她说明天还早要睡了，晚安。结果今天到现在一条没有……是不是昨晚聊太猛了，还是我想多了"
  AI思考: 热聊一夜后进入安静日，用户的解读开始摇摆。他手里的证据只有那声晚安是善意的，先钉住这个。
  选项: [让他把节奏放平]
  AI回复: 能聊到十一点半说明状态在线，今天的安静大概率就是普通的一天。别数小时，找点自己的事干，晚上要还聊不上再说。
  下一: 5.2.1

# ---------- 男生 · 5.2 聊热＋上头自察（真分叉） ----------
- 编号: 5.2.1
  所属: 男生
  标题: 聊热（一周后）
  用户消息: "连着聊一个多星期了，她回得慢但都会回，我好像摸到她的节奏了。今天她主动给我发了张加班的照片，配一个'困'字，她的猫踩着键盘抢镜，叫煤球，特别敬业。这算不算把我当自己人了"
  AI思考: 主动分享日常是信任信号。用户那句"回得慢但都会回"是他自己总结的相处模式，值得让他多说这类观察。
  选项: [顺着照片关心她]
  AI回复: 发自己状态图就是把你划进"可打扰"名单了。回"困就早点收工，别熬"，再夸一句猫主子敬业，聊猫永远安全。关心到位就收，别追加。
  记忆候选:
    - { 缩略标签: 都会回, 短句: "她回得慢但都会回", 类型: 对Ta的美化, 线: ②她的回避 }
    - { 缩略标签: 猫叫煤球, 短句: "她的猫踩着键盘抢镜，叫煤球", 类型: 干扰项, 线: 无 }
  下一: 5.2.2

- 编号: 5.2.2
  所属: 男生
  标题: 上头自察（次日）
  用户消息: "我现在一天能给她发八百条'在干嘛'，她有时候隔俩小时才回一条。发完我就去刷她朋友圈，看她又给谁点赞了。我是不是有点上头了，你客观说说"
  AI思考: 用户第一次自察：频率、等待、盯动态，全说出口了。肯定这份觉察本身，别急着开药方。
  选项: [肯定觉察，建议收着点, 热恋期都这样，不用压]
  AI回复:
    - 能说出"上头"两个字的人已经赢一半了。试试把"在干嘛"留给真想问的时候，一天挑两三个自然的节点聊，剩下的冲动先记着。
    - 刚认识都这样，投入不是毛病。真觉得刷得太多，就把"看动态"换成"直接找她聊"，同样是想她，后者至少她看得见。
  分叉: {肯定觉察，建议收着点: "5.2.3", 热恋期都这样，不用压: "5.2.4"}
  备注: 「八百条在干嘛」为台词纹理，不做候选（自己的真实归幕7产出）

- 编号: 5.2.3
  所属: 男生
  标题: 收敛试验（分支A·当晚）
  用户消息: "试了一天，说实话挺难受的。话到嘴边删了三回，最后就发了句晚安。她回得跟平时一样，也没问我今天咋这么安静……我感觉自己在演一个淡定的人"
  AI思考: 降低频率对他像戒断，对方并无异样反馈。承认难受是真实的，别让他把策略当成性格。
  选项: [告诉他演久了会成真]
  AI回复: 难受说明这不是你的自然节奏，是你在为一段还没定型的事让路。装一装可以，但别忘了原本的你什么样——她认识的，是那个一天八百条的你。
  下一: 5.3.1

- 编号: 5.2.4
  所属: 男生
  标题: 照旧自嘲（分支B·当晚）
  用户消息: "没压住，照旧一天八百条。她也没烦，就是回得慢，有时候一个'哈哈哈'隔俩小时才来。我对着屏幕自己跟自己聊天呢这是，笑死"
  AI思考: 维持高频输出，对方稳定接收但回馈有限。用户用自嘲消化落差，先把情绪接住。
  选项: [陪他自嘲一句，顺势提见面]
  AI回复: 一个人演双簧还能坚持一星期，这份深情建议直接当面用。线上聊到头也就是这样了，找机会约出来，见一面顶八百条。
  下一: 5.3.1

# ---------- 男生 · 5.3 约局到见面 ----------
- 编号: 5.3.1
  所属: 男生
  标题: 约局参谋（第二周）
  用户消息: "行，听人劝吃饱饭，我想约她周末出来吃个饭。就是不知道咋开口，直接问'周六有空吗'会不会显得猴急"
  AI思考: 从线上转线下的意向明确。需要具体话术加时间锚点，把"猴急"的负担也拆掉。
  选项: [给他一版邀约话术]
  AI回复: 聊一周多约饭不叫猴急，叫水到渠成。发"周六晚上有空吗，桌游输你的局还没讨回来，请你吃个饭"——由头、时间全齐，她只需要点头。
  下一: 5.3.2

- 编号: 5.3.2
  所属: 男生
  标题: 改期失落（周五）
  用户消息: "她周六来不了了，说项目临时有个节点，问改周日行不行。语气倒挺客气的，还带了个不好意思的表情。但我心里就是不得劲……是不是其实不想来，找的借口"
  AI思考: 用户把改期往拒绝方向解读。他能给出的依据只有：对方主动提了改期、语气客气。从这两个动作本身看，不像推脱。
  选项: [把"主动改期"这个动作指给他看]
  AI回复: 真不想来的人会给"下次一定"，不会自己把周日钉死。主动改期等于想来，只是这周身不由己。回"行，周日，你忙你的"，七个字，懂事又不失体面。
  下一: 5.3.3

- 编号: 5.3.3
  所属: 男生
  标题: 见面复盘（周日晚）
  用户消息: "见完了！吃饭散步聊了三个多小时，比线上放得开多了。她还问我下次想吃啥，说她想吃烤肉，下回带我吃。就是中间她回了好几条工作消息，我干坐着有点尴尬。对了，散步的时候我跟她坦白了个事：有次她半天没回消息，我半夜还在刷她朋友圈，看她睡了没。她笑了，说'你想得可真多'。这话……是好事还是坏事"
  AI思考: 当面交底半夜刷朋友圈，对方一笑带过。用户在反复咀嚼这句回应。先收住复盘焦虑，把"下次"这个正向信号摆到前面。
  选项: [先接住"下次"，再给交底定性]
  AI回复: “说她想吃烤肉、下回带你吃”，这是把以后默认进日程了，含金量最高的一句。至于半夜刷朋友圈，你能自己说出来，说明你有数，她那句“想得真多”没带刺，翻篇。
  记忆候选:
    - { 缩略标签: 想吃烤肉, 短句: "说她想吃烤肉", 类型: 干扰项, 线: 无 }
  下一: 5.3.4

- 编号: 5.3.4
  所属: 男生
  标题: 求确认（当晚）
  用户消息: "睡前最后问一句，你说我这两周的表现，到底有没有戏？我这人你知道的，上次这么上心还是给我表妹辅导作业的时候"
  AI思考: 用户寻求整体评估，语气半开玩笑半认真。手里的证据链够长，可以给个有依据的正向判断。
  选项: [给一个有依据的正向判断]
  AI回复: 秒回是常态、主动发日常、约完主动提下次——单拎一条都不算数，三条叠一块就是明确的"继续"。有戏，别自己吓自己。
  下一: 5.4.1

# ---------- 男生 · 5.4 表白（真分叉） ----------
- 编号: 5.4.1
  所属: 男生
  标题: 表白排练（两天后）
  用户消息: "我想跟她表白。稿子我打了删删了打，现在这版你听听：'我挺喜欢你的，想跟你正经处对象，你考虑考虑'。总感觉哪里不对，又说不上来"
  AI思考: 话术直白，"考虑考虑"四个字像发工作邀约。用户要的是温度，改成更像说话的版本。
  选项: [改成直球版, 改成含蓄版]
  AI回复:
    - “考虑考虑”太公事公办。改成“跟你聊天的时候我总是最放松的，我挺喜欢你，想跟你处对象，你觉得咱俩行不行”——感受放前面，问句收尾，她怎么接都不僵。
    - 别一上来就"处对象"。改成"跟你待一块的时候特别舒服，我可能有点喜欢你，你觉得呢"——留了余地，她要是也心动，接得住；要是不想，也有台阶。
  分叉: {改成直球版: "5.4.2", 改成含蓄版: "5.4.3"}

- 编号: 5.4.2
  所属: 男生
  标题: 直球发出（分支A·当晚）
  用户消息: "发了！用的直球版。发完我就后悔了，感觉跟裸奔一样。现在她在输入又停止，输入又停止，我心脏跟着一抽一抽的。你说她打那么久是在措辞还是想拒绝我"
  AI思考: 消息已发出，用户进入等待的极限状态。输入状态来回切换只说明对方在认真回应，推不出内容。
  选项: [让他停止解读，等就是了]
  AI回复: 输入中、停止、再输入，大概率是在斟酌，敷衍的人直接甩一句"哈哈"。你现在唯一能做的就是别盯着屏幕，去洗把脸，答案不会因为你盯着就早点来。
  下一: 5.4.4

- 编号: 5.4.3
