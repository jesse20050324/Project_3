# ============================================================
# 幕5 熟悉期 · 轮次设计稿（自主细化版，待用户审）
# 来源：script/synopsis.md 幕5 展开版（5.1~5.4）
# 状态：设计稿。幕5为自研块，无原文层，四条即当前版本。
# 编号约定：子拍分段 5.x.y；段内同相识期规则：分叉补1/2，单线补1。
# 接口（固定）：
#   入场 = 幕4 问/不问旗标（男问/女问），开场三变体按此选一，随即汇合
#   出口 = 两侧终拍都立「在一起」→ 进块6+7
#   女生 5.2.1、5.2.11 需等男生对应拍完成；女生 5.4.1 需等男生 5.4.11
# 铁律：四条 = 用户消息 / AI思考(DeepSeek式自言自语，两三句，30~40字) /
#   选项(短语，AI自言自语态度，去掉"我要") / AI回复(像人但带AI味，一两句)
# 备注 = 态度建议（如关系值方向），非死设定，机制延后。
# ============================================================

章: 5
标题: 第五幕 · 熟悉期

轮次:

# ---------- 男生 · 5.1 开场三变体（按幕4旗标选一，随即汇合） ----------
- 编号: 5.1.1-A
  所属: 男生
  入场: 双问（男问+女问）
  标题: 开场·双问
  用户消息: "我妹刚跟我说，那个女生昨天也找她要过我的微信！我靠，我俩这是想到一块去了？那第一句我发啥才不尬，你说"
  AI思考: 用户得知对方也主动要过联系方式，情绪明显上头。需要趁热给个具体开场句，顺带提醒别用力过猛。
  选项: [给一句自然开场]
  AI回复: 人家对你也有印象，稳了。直接发"hi，我是那天桌游的XX"，别整开场白，越随意越自然。
  下一: 5.1.11

- 编号: 5.1.1-B
  所属: 男生
  入场: 仅男问
  标题: 开场·仅男问
  用户消息: "微信搞到手了，我妹那个同桌的。但我盯着输入框半小时了，第一句发啥啊，'你好'像上门查水表的"
  AI思考: 用户要到了微信却卡在第一句。需要给具体话术，顺便降低他的心理负担。
  选项: [给一句自然开场]
  AI回复: 别写你好，太正式。就发"hi，那天桌游我旁边那个，还记得不"，有记忆点又不用力。
  下一: 5.1.11

- 编号: 5.1.1-C
  所属: 男生
  入场: 仅女问
  标题: 开场·仅女问
  用户消息: "出大事了，我还没鼓起勇气去要微信呢，她直接加我了！是不是我妹出卖了我？她啥意思啊这是"
  AI思考: 对方主动加了用户，超出预期。需要说明这是积极信号，别让他继续脑播。
  选项: [告诉用户这是积极信号]
  AI回复: 你管谁牵的线，人家主动加你就是愿意聊。先回"hi"，剩下的慢慢来。
  下一: 5.1.11

- 编号: 5.1.11
  所属: 男生
  标题: 第一句·慢回初显
  用户消息: "我发了！她过了四十多分钟才回，回了个'记得，你也要到点睡了'。这算不算冷淡啊，我盯着屏幕不知道咋接了"
  AI思考: 用户开始用回复间隔衡量态度，过度解读初现。需要说明对方可能在忙，同时给出具体回法。
  选项: [安抚用户并给出回法]
  AI回复: 四十分钟不算冷淡，人家有自己的事。这句还关心你睡不睡呢。回"还没呢，刚聊上正兴奋"，接住就行。
  备注: 矛盾①「回复慢」糖化首现。安抚路线=关系值+方向（态度建议，非死设定）
  下一: 5.1.111

- 编号: 5.1.111
  所属: 男生
  标题: 聊热三天·加班照片
  用户消息: "我们连着聊三天了，她回得慢但都会回。今天她还主动给我发了张加班的照片，配了个'困'字。我回啥"
  AI思考: 对方主动分享日常，是升温信号。需要让用户把"困"接住，表达关心但不过火。
  选项: [顺着照片关心一下]
  AI回复: 主动发照片是好事，她想让你看到她的状态。回"困就早点收工，别熬秃了"，关心到点上，再多就腻了。
  下一: 5.1.1111

- 编号: 5.1.1111
  所属: 男生
  标题: 在干嘛轰炸·上头自察
  用户消息: "我现在一天能给她发八百条'在干嘛'，她有时候隔俩小时才回。发完我就盯着她朋友圈刷，我是不是有点上头了"
  AI思考: 用户意识到自己上头，患得患失初现，但整体还在甜蜜阶段。需要肯定他的觉察，给减频建议，别吓着他。
  选项: [肯定觉察，建议降低频率]
  AI回复: 能意识到就还不算上头。试试一天两三条，挑她方便的时候发。你越从容，聊得反而越舒服。
  备注: 焦虑型显形第一拍；选项不同只改后续措辞基调，走向收束到约局
  下一: 5.2.1

# ---------- 男生 · 5.2 第一次见面 ----------
- 编号: 5.2.1
  所属: 男生
  标题: 约局参谋
  用户消息: "光线上聊不行了，我想约她出来吃个饭，周六。你说咋开口，会不会显得我很急"
  AI思考: 用户要从线上转线下，需要具体邀约话术，并解释邀约本身不丢人。
  选项: [给出邀约话术]
  AI回复: 不急，都聊一周了。直接说"周六有空吗，我知道一家店评价不错，带你去尝尝"，具体时间加具体事，比干问"有空吗"强十倍。
  备注: AI军师惯例第一次甜味使用（幕8.2实时求助的前置铺垫）
  下一: 5.2.11

- 编号: 5.2.11
  所属: 男生
  标题: 改期失落
  用户消息: "她周六去不了了，说项目临时有事，改周日。语气倒是挺好的，但我咋觉得……她是不是其实不想来"
  AI思考: 用户把改期往坏了解读。实际情况是对方真的加班，玩家在另一侧可见。需要拦住脑补，给个得体的回应话术。
  选项: [安抚用户并给回应话术]
  AI回复: 项目的事身不由己，她还主动提了改周日，这就是想来的意思。回"行，那周日，你忙你的"，懂事又不黏人。
  备注: 与女生5.2.11构成同一事件的双版本，信息差主场之一
  下一: 5.2.111

- 编号: 5.2.111
  所属: 男生
  标题: 见面复盘·他版
  用户消息: "见完了！吃饭散步都挺好，就是她中间回了好几条工作消息，我干坐着。不过我说了个特冷的笑话她居然都笑了，还问我下次想吃啥"
  AI思考: 对方问下次是明确的好信号，用户却纠结看手机的事。需要把他的注意力引向积极面。
  选项: [点出"下次"信号]
  AI回复: 注意重点：她说的是"下次"，这比啥都强。回工作消息是成年人常态，别往心里去。她能跟你散完这一路，就是舒服。
  下一: 5.3.1

- 编号: 5.3.1
  所属: 男生
  标题: 复盘收束·求确认
  用户消息: "你说我是不是真的有戏？我一个社恐，上次跟人这么连着聊，对象还是我表妹"
  AI思考: 用户语气认真，在寻求确认。需要给不夸张但正向的评估，顺势把话题引向推进。
  选项: [给出正向评估]
  AI回复: 数据不骗人：秒回你、主动发照片、约完还问下次，这要没戏我就白分析了。有戏，就差临门一脚了。
  下一: 5.4.1

- 编号: 5.4.1
  所属: 男生
  标题: 表白排练
  用户消息: "我想跟她表白。话我打好又删了七八遍了，你帮我看一眼：'我挺喜欢你的，想正经跟你处对象，你考虑考虑'"
  AI思考: 用户的话术直白有余温度不足，"考虑考虑"像谈生意。需要改成更自然、给对方留空间的版本。
  选项: [帮他改表白话术]
  AI回复: 意思对，就是"考虑考虑"太像面试。改成"跟你在一块的时候特别舒服，我挺喜欢你的，想跟你处对象，你要是也觉得行，咱就试试"。真诚，还给台阶。
  备注: AI军师惯例第二次甜味使用
  下一: 5.4.11

- 编号: 5.4.11
  所属: 男生
  标题: 表白结果
  用户消息: "发了！！她过了半小时回的……'我也想试试，只是我可能不太会谈恋爱，你多担待'。我靠？？这是答应了吧？？这是答应了吧！"
  AI思考: 对方答应了，还提前交底自己不擅长亲密关系。用户光顾着高兴没细品这句。先道贺，再轻轻标记这句话。
  选项: [道喜，并提醒记住她这句交底]
  AI回复: 是答应了，恭喜。另外把她那句"不太会谈恋爱"记下来，这是提前交底。哪天她做得笨拙了，你就想起今天这句话。
  下一: 出口·在一起
  终局: 男生·在一起

# ---------- 女生 · 5.1 开场三变体 ----------
- 编号: 5.1.1-A
  所属: 女生
  入场: 双问（男问+女问）
  标题: 开场·双问
  用户消息: "我同桌说漏嘴了，那个表哥前两天也找她要过我的微信。等于我俩是互相要的？？那我现在先说话，会不会显得我知道这事似的"
  AI思考: 双方都主动要过联系方式，用户表面纠结实则开心。需要给个自然开场，别让她端着。
  选项: [给出自然开场方案]
  AI回复: 互相都惦记着，谁先开口都不掉价。就发"hi，同桌牵线那位"，把窗户纸点破了，他准松一口气。
  下一: 5.1.11

- 编号: 5.1.1-B
  所属: 女生
  入场: 仅女问
  标题: 开场·仅女问
  用户消息: "我同桌把表哥微信推给我了，让我先加。我有点不好意思，你说是我加他合适，还是等他加我"
  AI思考: 用户在纠结加微信的顺序，本质是怕显得主动。需要告诉她主动不等于掉价，给具体做法。
  选项: [建议直接加，说明主动不掉价]
  AI回复: 都推微信了还讲究谁先点发送？你加他，备注"桌游那位"，大方点。等他加你，说不定等一礼拜。
  下一: 5.1.11

- 编号: 5.1.1-C
  所属: 女生
  入场: 仅男问
  标题: 开场·仅男问
  用户消息: "那个表哥加我微信了，就桌游那天见过的。有点意外，我都快忘了这茬了。通过了说点啥"
  AI思考: 对方主动联系，用户态度平淡中带一点意外。不需要推动她热情，给个自然的回应即可。
  选项: [给个自然的回应建议]
  AI回复: 先通过，回个"hi，那天桌游的"，看他聊啥再定。不感兴趣的话题礼貌收住就行，不用有压力。
  下一: 5.1.11

- 编号: 5.1.11
  所属: 女生
  标题: 慢回的真相
  用户消息: "他消息回得也太勤快了……我一下班攒了一堆没回的。不是不想回他，就是下班累得话都不想说，而且不知道说啥显得有意思"
  AI思考: 用户不是冷淡，是疲惫加上不会表达，这点她自己都说不清。需要给她减负方案，别硬聊。
  选项: [给她减负的回法]
  AI回复: 累就直说"下班瘫了，今天不想动脑子"，比硬撑着尬聊强，他反而踏实。攒着的话题挑个有精神的晚上回，质量比数量值钱。
  备注: 矛盾①女生侧真相首次呈现，与男生5.1.11对位（他读作"她好忙"，实际是"累+不会表达"）
  下一: 5.1.111

- 编号: 5.1.111
  所属: 女生
  标题: 事业糖·他的"走一步看一步"
  用户消息: "他好像一点都不愁将来。我说我天天想着怎么多挣点钱往上走，他就说'走一步看一步呗'。这种心态是真稳还是心大啊"
  AI思考: 用户在评估对方的人生态度，语气一半欣赏一半疑惑。需要如实呈现两种可能，不替她下结论。
  选项: [如实分析两种可能]
  AI回复: 两种都有可能。真稳的人是心里有数所以不慌；心大的人是没数所以不想。多观察他闲下来都干嘛，那个骗不了人。
  备注: 矛盾③糖化。她的疑惑被自己消化成欣赏，伏笔埋下不说破
  下一: 5.1.1111

- 编号: 5.1.1111
  所属: 女生
  标题: 打岔·他没追问
  用户消息: "他今天问我家是哪的、家里什么情况，我岔开聊别的了，他也没追问。还挺好的，不逼人，换个人我早烦了"
  AI思考: 用户对深挖式提问敏感，回避深层话题是习惯。对方没追问让她感到舒适。需要肯定这种节奏，不点破她的回避。
  选项: [肯定这种相处节奏]
  AI回复: 他这个分寸感确实难得。你想说的时候自然会说，不想说就岔开，这样相处不累。节奏舒服比聊得多重要。
  备注: 回避型习惯显形，但她自己归因为"他体贴"——糖化处理。真相留到幕8.5
  下一: 5.2.1

# ---------- 女生 · 5.2 第一次见面（需等男生对应拍） ----------
- 编号: 5.2.1
  所属: 女生
  等待: 男生5.2.1
