# ---------- 男生 · 5.1 开场三变体＋收敛拍（D1 傍晚） ----------
- 编号: 5.1.1-A
  所属: 男生
  入场: 双问（男问+女问）
  时间: D1 傍晚（周日，互加当天）
  标题: 开场·双问（D1 傍晚）
  用户消息: "我妹刚才跟我说，那女生昨天也找她要过我微信！等于是我俩想到一块去了？那第一句我发啥才不显得刻意，你给定个调"
  AI思考: 两边都要过联系方式，用户明显上头。先给能用的开场句，再轻踩一脚别用力过猛。
  选项: [给一句自然的开场]
  AI回复: 互相都惦记，这开局不亏。就发"hi，那天桌游坐我斜对面的"，有记忆点又不刻意。别写小作文，第一个字发出去就赢了。
  下一: 5.1.2

- 编号: 5.1.1-B
  所属: 男生
  入场: 仅男问
  时间: D1 傍晚（周日，互加当天）
  标题: 开场·仅男问（D1 傍晚）
  用户消息: "微信到手了，我妹牵的线。但我对着输入框抠了半小时了，第一句咋整，总不能发'你好'吧，像上门推销的"
  AI思考: 要到了微信却卡在第一句，紧张大于兴奋。给个具体的句子，顺便把心理负担卸了。
  选项: [给一句自然的开场]
  AI回复: 别"你好"，太像客服。发"hi，桌游那天输得最惨的那个，想起我没"，自嘲比装酷好使，她接哪句都顺。发完把手机扣桌上，别盯着。
  下一: 5.1.2

- 编号: 5.1.1-C
  所属: 男生
  入场: 仅女问
  时间: D1 傍晚（周日，互加当天）
  标题: 开场·仅女问（D1 傍晚）
  用户消息: "反转了兄弟，我还没想好咋开口呢，她直接加我了！是不是我妹泄密了？她这啥意思啊"
  AI思考: 对方主动加好友，超出用户预期。先定性这是好信号，拦住过度脑补。
  选项: [告诉她这是好信号]
  AI回复: 谁泄的密不重要，人家愿意加你就是愿意聊。通过，回个"hi，终于等来你了"都行。主动的一方已经交卷了，你照抄就完事。
  下一: 5.1.2

- 编号: 5.1.2
  所属: 男生
  时间: D1 傍晚（周日，互加当天）
  标题: 开场定稿·收敛拍（D1 傍晚，几分钟后）
  用户消息: "想了想，你给的那句对我来说还是太溜了，怕她看出来是背的。我就发个实在的：'hi，上次桌游坐你旁边的，还记得我不？提前说一声，我作息特别老年，十一点必睡'。这句行不"
  AI思考: 用户没照建议走，自己改了个更朴素的版本。这版有他自己的味道，还自带梗，保他。
  选项: [就发这版，挺好]
  AI回复: 这版比我的建议强。"还记得我不"给她递了话头，"十一点必睡"先把底交了。发吧，发完别盯着屏幕。
  下一: 5.1.3
  备注: 收敛拍——三变体的不同开场建议在此收敛成同一句，之后全章下游只有一种事实

- 编号: 5.1.3
  所属: 男生
  时间: D1 晚
  标题: 慢回初显（D1 晚，发出约四十分钟后）
  用户消息: "发了！结果她过了四十来分钟才回，就一句'记得，你也要到点睡了'。这算热情还是冷淡啊，我现在不知道咋接"
  AI思考: 用户开始用回复间隔给态度打分。他贴的原文里"记得"和"到点睡"都是接住他的信号，先指给他看。
  选项: [收住，今晚就到这, 接住话头，再聊一会儿]
  AI回复:
    - 四十来分钟在成年人世界里就是"刚看到"。她那句重点是"记得"——你的自我介绍她接住了。回"还没呢，刚聊上头了"，再道个晚安就下线，第一晚留点余地。
    - 她这句是礼貌收尾，你要是不想就这么完了，就回"还没呢，你一说我倒精神了——我那天输你的局还没翻盘呢，什么时候再战"，用梗把话头续上，聊到自然收。
  分叉: {收住，今晚就到这: "5.1.4", 接住话头，再聊一会儿: "5.1.5"}

- 编号: 5.1.4
  所属: 男生
  时间: D2 白天（周一）
  标题: 稳住一夜（分支A·D1深夜收住，D2白天复盘）
  用户消息: "听你的收住了，睡前互相道了个晚安，我还赶在十一点前睡的，破天荒。今早她又正常找我聊了两句，好像也没啥事。就是……我这心里空落落的，总觉得少了点啥"
  AI思考: 按兵不动一夜，联系没断，用户的空落感反而冒头。点破他要的其实是密度，但不评判。
  选项: [告诉他这是正常的落差]
  AI回复: 没多聊不等于失去，节奏换了个挡而已。那点空落，是你还想聊得更多的证据。记着这感觉就行，别急着用消息去填满。
  下一: 5.1.6

- 编号: 5.1.5
  所属: 男生
  时间: D2 白天（周一）
  标题: 接住之后（分支B·D1晚热聊，D2白天复盘）
  用户消息: "接住了！顺着翻盘那个梗真聊起来了，一直聊到十一点多，我自己立的'十一点必睡'当天就倒了，笑死。她说该睡了，晚安。结果今天到现在一条没有……是不是昨晚聊太猛了，还是我想多了"
  AI思考: 热聊一夜后进入安静日，用户的解读开始摇摆。他手里的证据只有昨晚那句晚安是善意的，先钉住这个。
  选项: [让他把节奏放平]
  AI回复: 能聊到十一点多说明状态在线，今天的安静大概率就是普通的一天。别数小时，找点自己的事干，晚上要还聊不上再说。
  下一: 5.1.6

- 编号: 5.1.6
  所属: 男生
  时间: D2 晚
  标题: 渐入佳境（汇合·D2 晚）
  用户消息: "晚点更新：她晚上主动来找我了，这回聊了一个多钟头，还挺尽兴。之前我老盯着'她多久回、回几个字'这种破事琢磨，现在感觉慢慢摸到点节奏了。可能真像你说的，急不得"
  AI思考: 两天的样本还小，但节奏感在成形，焦虑暂时退潮。肯定这份平稳，提醒他别急着赶进度。
  选项: [肯定节奏，提醒别赶进度]
  AI回复: 看，晚上这不就来了。节奏这东西，你越不掐表它越顺。这两天就当热身，后面让它自己长。
  下一: 5.2.1
  备注: 汇合拍——①兼容5.1.4（空落后的回甘）与5.1.5（安静日的钩子兑现）两种前情

# ---------- 男生 · 5.2 聊热＋上头自察（真分叉） ----------
- 编号: 5.2.1
  所属: 男生
  时间: D9（下周一）
  标题: 聊热（D9，一周多后）
  用户消息: "连着聊一个多星期了，她回得慢但都会回，我好像摸到她的节奏了。今天她还主动给我发了张加班的照片，配一个'困'字，她的猫踩着键盘抢镜，叫煤球，特别敬业。这算不算把我当自己人了"
  AI思考: 主动分享日常是信任信号。用户那句"回得慢但都会回"是他自己总结的相处模式，值得让他多说这类观察。
  选项: [顺着照片关心她]
  AI回复: 发自己状态图就是把你划进"可打扰"名单了。回"困就早点收工，别熬"，再夸一句猫主子敬业，聊猫永远安全。关心到位就收，别追加。
  记忆候选:
    - { 缩略标签: 都会回, 短句: "她回得慢但都会回", 类型: 对Ta的美化, 线: ②她的回避 }
    - { 缩略标签: 猫叫煤球, 短句: "她的猫踩着键盘抢镜，叫煤球", 类型: 干扰项, 线: 无 }
  下一: 5.2.2

- 编号: 5.2.2
  所属: 男生
  时间: D10（周二）
  标题: 上头自察（D10）
  用户消息: "我现在一天能给她发八百条'在干嘛'，她有时候隔俩小时才回一条。发完我就去刷她朋友圈，看她又给谁点赞了。我是不是有点上头了，你客观说说"
  AI思考: 用户第一次自察：频率、等待、盯动态，全说出口了。肯定这份觉察本身，别急着开药方。
  选项: [肯定觉察，建议收着点, 热恋期都这样，不用压]
  AI回复:
    - 能说出"上头"两个字的人已经赢一半了。试试把"在干嘛"留给真想问的时候，一天挑两三个自然的节点聊，剩下的冲动先记着。
    - 刚认识都这样，投入不是毛病。真觉得刷得太多，就把"看动态"换成"直接找她聊"，同样是想她，后者至少她看得见。
  分叉: {肯定觉察，建议收着点: "5.2.3", 热恋期都这样，不用压: "5.2.4"}
  备注: 「八百条在干嘛」为台词纹理，不做候选（自己的真实归幕7产出）

- 编号: 5.2.3
  所属: 男生
  时间: D10 晚
  标题: 收敛试验（分支A·D10 晚）
  用户消息: "试了一天，说实话挺难受的。话到嘴边删了三回，最后就发了句晚安。她回得跟平时一样，也没问我今天咋这么安静……我感觉自己在演一个淡定的人"
  AI思考: 降低频率对他像戒断，对方并无异样反馈。承认难受是真实的，别让他把策略当成性格。
  选项: [告诉他演久了会成真]
  AI回复: 难受说明这不是你的自然节奏，是你在为一段还没定型的事让路。装一装可以，但别忘了原本的你什么样——她认识的，是那个一天八百条的你。
  下一: 5.2.5

- 编号: 5.2.4
  所属: 男生
  时间: D10 晚
  标题: 照旧自嘲（分支B·D10 晚）
  用户消息: "没压住，照旧一天八百条。她也没烦，就是回得慢，有时候一个'哈哈哈'隔俩小时才来。我对着屏幕自己跟自己聊天呢这是，笑死"
  AI思考: 维持高频输出，对方稳定接收但回馈有限。用户用自嘲消化落差，先把情绪接住。
  选项: [陪他自嘲一句，顺势提见面]
  AI回复: 一个人演双簧还能坚持一星期，这份深情建议直接当面用。线上聊到头也就是这样了，找机会约出来，见一面顶八百条。
  下一: 5.3.1

- 编号: 5.2.5
  所属: 男生
  时间: D11（周三）
  标题: 缓冲·约线下（分支A·D11）
  用户消息: "又憋了一天。不找她吧心里空得慌，找她吧又怕招人烦。你说我这一天天的，线上聊得再欢，她一忙起来我还是干等着。这咋整"
