# ============================================================
# 幕5 熟悉期 · 轮次设计稿 v2（按两条主线矛盾重构 + memory 标注）
# 来源：script/synopsis.md 幕5 展开版 + memory 模型讨论定稿
# 状态：设计稿 v2。幕5为自研块，无原文层，四条即当前版本。
#
# Memory 模型（本轮定稿）：
#   每个核心矛盾 = 一个点，四要素：
#     真实     = 本人独白，只在本人↔AI聊天框里，对方线永远不可见
#     前期行为 = 原始行为事实，入对方线，是"认识到"的钥匙
#     前期理解 = 对方贴的糖滤镜，入对方线，是"外归因"的燃料
#     后期理解 = 幕8现场刀，不入库（写在8.2-8.4吵架台词里，零存储成本）
#   判定：8.5 认识到 = 本线前期行为类≥2；外归因永远可选（糖越多台词越丰满）；
#   槽位全局共享、判定分线；缺钥匙则认识到灰显并提示。
#
# 两条主线矛盾（其余内容均为发散点缀，不作为设计点）：
#   ① 他的焦虑：真实=焦虑，想确认、想拉近距离；表现=频繁找她
#      （前期理解=她觉得他体贴；后期理解=烦人、没主见）
#   ② 她的回避：真实=恐惧关系，想拉远距离；表现=不回消息、放鸽子、对人热情
#      （前期理解=他觉得她独立、开朗；后期理解=冷漠、只对其他人热情）
#
# 记忆候选字段：短句 = ①里的原文提取；类型 ∈ {真实, 前期行为, 前期理解}
# 编号约定：子拍分段 5.x.y；段内分叉补1/2，单线补1。
# 接口：入场=幕4 问/不问旗标（三变体开场）；出口=在一起=true 进块6+7；
#   女生5.2.1/5.2.11等男生对应拍；女生5.4.1等男生5.4.11。
# ============================================================

章: 5
