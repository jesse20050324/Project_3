# ============================================================
# 幕5 熟悉期 · 轮次设计稿 v3.1（2026-11-07 分叉改造 + 记忆手术）
# 方法：两条主线矛盾 → 记忆矩阵（每窗正料4条，详见 outline 记忆体系节）
#
# 两条主线矛盾（定稿）：
#   ① 他的"过近"：真实=焦虑，想确认、想让距离很近（遮掩形态=控制欲，写作中不直说）
#     表现=频繁找她、秒回、在意她动态
#     她的前期理解（对Ta美化）=他很有爱：家里给了很多爱、会健康地去爱人的人
#   ② 她的"过远"：真实=恐惧深层关系，想保持距离
#     表现=回得慢、放鸽子、对谁都热闹
#     他的前期理解（对Ta美化）=独立、开朗
#
# 合法跨线通道（对话隔离的唯一例外）：
#   AI 永不跨窗；但角色之间可以说话。角色当面/微信里对彼此说的话，
#   可以由听到的一方转述进自己的窗，成为本窗的记忆证据。
#
# 记忆产出清单（2026-11-07 手术后；「自己的真实」改在幕7产出，
#   幕5两条旧自白降为台词不入槽）：
#   男窗：Ta真实①「不会谈恋爱」=她说她可能不太会谈恋爱（5.4.11）
#         对她的美化「都会回」=她回得慢但都会回（5.1.111）
#   女窗：Ta真实①「半夜刷朋友圈」=他说有次我半夜还在刷你朋友圈（5.2.111）
#         对他的美化「家里有爱」=他是不是家里给了特别多爱才这么会关心人（5.2.111）
#   干扰项（每窗2枚，生活趣闻，无性格指向）：
#   男窗：「猫叫煤球」（5.1.111，纯占）、「想吃烤肉」（5.2.111，自销在幕7夜聊）
#   女窗：「同桌是表妹」（5.2.1，自销在幕7组局）、「头像是小熊」（5.1.11，纯占）
#
# 判定挂幕8·二（2026-11-07 定稿，详见 outline「记忆体系」节）：
#   认识到自己=存了幕7自己的真实；认识到对方=存了对Ta美化+5或7章Ta真实至少一条；
#   应和线永远可选。终局跟玩家点的选项走。
#
# 现实时间块（2026-11-07 标注，防节拍错误——剧情不匀速）：
#   幕1-4 相识=同一个周末；幕5=线上约3周（互加第1-2天开场、第三天慢回、
#   一周后聊热、第二周约局、周日晚见面、两天后表白）；幕6=表白次日官宣；
#   幕7=蜜月2-4周；8A=在一起满月纪念日当晚；8B=次日爆发判定。
#   各拍标题括号内=该拍发生的现实时间。
#
# 2026-11-07 改造记录：
#   ①「八百条在干嘛」「怕太深入」降为台词纹理，候选移除（自己的真实归幕7产出）
#   ② 每窗新增5处快收束分叉（选项不同、④不同、下一拍同，剧情不翻倍）
#   ③ 拍标题加时间标注
# ============================================================

