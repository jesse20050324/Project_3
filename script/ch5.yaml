# ============================================================
# 幕5 熟悉期 · 轮次设计稿 v4（2026-11-07 真分叉重做＋AI思考窗口隔离）
# 方法：两条主线矛盾 → 记忆矩阵（每窗正料4条，详见 outline 记忆体系节）
#
# 两条主线矛盾（定稿）：
#   ① 他的"过近"：真实=焦虑，想确认、想让距离很近（遮掩形态=控制欲，写作中不直说）
#     表现=频繁找她、秒回、在意她动态
#     她的前期理解（对Ta美化）=他很有爱：家里给了很多爱、会健康地去爱人的人
#   ② 她的"过远"：真实=恐惧深层关系，想保持距离
#     表现=回得慢、放鸽子、对谁都热闹
#     他的前期理解（对Ta美化）=独立、开朗
#
# v4 两条新铁律（2026-11-07 用户裁定）：
#   铁律A AI思考窗口隔离：AI只能基于本窗可见信息（本窗历史＋本拍①原文）推理，
#     不得断言另一窗/现实侧事实（如"她其实真的在加班"）、不得对玩家喊话
#     （如"玩家在另一侧可见"）、不得使用设计层词汇（滤镜/投射/糖/钥匙等）。
#   铁律B 真分叉：两个选项不得直连同一个下一拍。分叉必须分出到各自独立的
#     分支拍（各有完整①②③④、质地不同），1-2拍后收回主线汇合拍；
#     汇合拍的①须两种前情都读得通。分支只改本窗内心戏，不改发给对方的
#     外显消息文本，跨线引用原话两窗必须一致。
#
# 记忆产出清单（手术定稿；「自己的真实」归幕7产出，幕5两条旧自白降为台词）：
#   男窗：Ta的真实「不会谈恋爱」=只是我可能不太会谈恋爱（5.4.4，她交底原话）
#         对Ta的美化「都会回」=她回得慢但都会回（5.2.1）
#   女窗：Ta的真实「半夜刷朋友圈」=他半夜还在刷我朋友圈，看我睡了没（5.3.3，转述）
#         对Ta的美化「家里有爱」=是不是家里给了特别多爱，才这么会关心人（5.3.3）
#   干扰项（类型=干扰项；自销=存了之后指定拍AI回复多或变一句，故事照走）：
#   男窗：「猫叫煤球」（5.2.1，纯占）、「想吃烤肉」（5.2.1→5.3.3，自销在幕7夜聊）
#   女窗：「头像是小熊」（5.1.2，纯占）、「同桌是表妹」（5.3.1，自销在幕7组局）
#
# 判定挂幕8·二（定稿，详见 outline「记忆体系」节）：
#   认识到自己=存了幕7自己的真实；认识到对方=存了对Ta美化+5或7章Ta真实至少一条；
#   应和线永远可选。终局跟玩家点的选项走。幕5只做产出，不做判定。
#
# 现实时间块（防节拍错误——剧情不匀速）：
#   幕1-4 相识=同一个周末；幕5=线上约3周（互加第1-2天开场、第三天慢回、
#   一周后聊热、第二周约局、周日晚见面、两天后表白）；幕6=表白次日官宣；
#   幕7=蜜月2-4周；8A=在一起满月纪念日当晚；8B=次日爆发判定。
#   各拍标题括号内=该拍发生的现实时间。
#
# 2026-11-07 v4 改造记录（在 v3.1 手术基础上重做执行层）：
#   ① 保留：候选手术（八百条在干嘛/怕太深入降为台词纹理）、时间标注、
#      开场三变体、跨线锚点与两窗引用原话
#   ② 重做：每窗3处真分叉（5.1.2 慢回 / 5.2.2 上头 / 5.4.1 表白·男；
#      5.1.2 慢回 / 5.2.1 热闹 / 5.4.1 表白·女），每处分出到两个独立分支拍、
#      1拍后收回；原 v3.1 的"选项不同、下一拍相同"假分叉全部废除
#   ③ 重写：全部AI思考改为本窗视角，删除跨窗断言与对玩家喊话
#   ④ 类型字段改用四格全名（Ta的真实/对Ta的美化/干扰项）
# ============================================================

