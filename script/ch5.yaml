# ============================================================
# 幕5 熟悉期 · 轮次设计稿 v5（2026-11-08 时序重排＋设计流程固化）
# 方法：两条主线矛盾 → 记忆矩阵（每窗正料4条，详见 outline 记忆体系节）
# 设计规程：script/设计流程.md（时间轴先行五阶段——写本稿前已过一遍）
#
# 两条主线矛盾（定稿）：
#   ① 他的"过近"：真实=焦虑，想确认、想让距离很近（遮掩形态=控制欲，写作中不直说）
#     表现=频繁找她、秒回、在意她动态
#     她的前期理解（对Ta美化）=他很有爱：家里给了很多爱、会健康地去爱人的人
#   ② 她的"过远"：真实=恐惧深层关系，想保持距离
#     表现=回得慢、放鸽子、对谁都热闹
#     他的前期理解（对Ta美化）=独立、开朗
#
# 世界事实登记（全章唯一，两窗引用必须一字不差）：
#   - 谁先开口：男生先发第一条消息（女5.1.1三变体=收到这条消息）
#   - 开场消息原话：hi，上次桌游坐你旁边的，还记得我不？提前说一声，
#     我作息特别老年，十一点必睡（男5.1.2拟定＝女5.1.1-A/B/C引用）
#   - 女生首答原话：记得，你也要到点睡了（男5.1.3转述＝女5.1.2回捞）
#   - 改期回复原话：行，周日，你忙你的（男5.3.2建议＝女5.3.2引用）
#   - 表白答复原话：我也想试试，只是我可能不太会谈恋爱，你多担待
#     （女5.4.2起草、女5.4.4发出＝男5.4.4收到）
#   - 桌游输赢方向：他输给她（新手vs老手；"输的局讨回来"是贯穿梗：
#     5.1.3续聊埋、5.3.1邀约收）
#   - 半夜刷朋友圈交底：男5.3.3行动侧＝女5.3.3接收侧（同一事件各自叙述）
#
# 铁律（七条，全文见 AGENTS.md；v4新增两条、v5新增一条）：
#   A AI思考窗口隔离：只基于本窗历史＋本拍①原文推理，不断言另一窗事实、
#     不对玩家喊话、不用设计层词汇（滤镜/投射/糖/钥匙）。
#   B 真分叉：两选项不直连同一节点；分出到独立分支拍（各有完整①②③④、
#     质地不同），1-2拍收回；汇合拍①须对所有可达前情成立；分支只改本窗
#     内心戏，不改外显消息文本。
#   C 时序先行：每拍标游戏世界时间（时间字段，须与顶层时间轴条目一字不差）；
#     跨窗约束先在时间轴上设计死（严格先后=等待门／范围包含／同段自由）。
#
# 时间轴（游戏世界；D1=周日桌游当天互加，D17=周二表白）：
#   D1傍晚开场→D1晚慢回分叉→D2渐入佳境→D3她慢回真相→D9聊热→D10上头分叉
#   →D11她的热闹（落在男5.2.3/5.2.4-5.3.1区间）→D12约局→D13周五改期
#   →D15周日晚见面→D17表白。等待门共7个，全部指向共享拍：
#   女5.1.1←男5.1.2；女5.1.2←男5.1.6；女5.2.1←男5.2.2；女5.3.1←男5.3.1；
#   女5.3.2←男5.3.2；女5.3.3←男5.3.3；女5.4.1←男5.4.4
#
# 记忆产出清单（手术定稿；「自己的真实」归幕7产出，幕5两条旧自白降为台词）：
#   男窗：Ta的真实「不会谈恋爱」=只是我可能不太会谈恋爱（5.4.4，她交底原话）
#         对Ta的美化「都会回」=她回得慢但都会回（5.2.1）
#   女窗：Ta的真实「半夜刷朋友圈」=他半夜还在刷我朋友圈，看我睡了没（5.3.3，转述）
#         对Ta的美化「家里有爱」=是不是家里给了特别多爱，才这么会关心人（5.3.3）
#   干扰项（类型=干扰项；自销=存了之后指定拍AI回复多或变一句，故事照走）：
#   男窗：「猫叫煤球」（5.2.1，纯占）、「想吃烤肉」（5.3.3，自销在幕7夜聊）
#   女窗：「头像是小熊」（5.1.3，纯占）、「同桌是表妹」（5.3.1，自销在幕7组局）
#
# 判定挂幕8·二（定稿，详见 outline「记忆体系」节）：幕5只做产出，不做判定。
#
# 2026-11-08 v5 改造记录（用户半章审稿反馈→根因→整体重排）：
#   ① 时间轴先行：开场与慢回收回同一天（D1），删掉"第二天/第三天"的错误跨度；
#      女窗补初聊反馈拍，消除"刚加微信→攒了一堆没回"断层；女5.2.x 对位到
#      男5.2.3/5.2.4-5.3.1 区间
#   ② 分支传播修复：新增男5.1.2收敛拍（三变体的开场建议收敛成同一句发出去，
#      女侧三变体引用同一句，天然不露馅）；修 v4 遗留 bug——5.1.3④B"这就睡"
#      与5.1.5"聊到十一点多"矛盾，分叉改为"收住就睡/接住续聊"两种真行为
#   ③ 情绪钩子补反馈拍：男5.1.6渐入佳境（D2晚汇合，兼容两分支前情）兑现
#      5.1.4/5.1.5 的悬念；男5.2.5缓冲拍（A路专属）衔接"收敛试验→约局"
#   ④ 修"双方都要先开口"共享事件矛盾：男生先发；女5.1.1三变体重写为
#      "收到他的第一条消息"版
#   ⑤ 统一桌游输赢方向（他输给她），5.1.1-B④/5.1.3④B/5.3.1④ 全部对齐
