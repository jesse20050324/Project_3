# ============================================================
# 幕5 熟悉期 · 轮次设计稿 v3（方法论正推重构，非旧稿修补）
# 方法：两条主线矛盾 → 四要素 → 每窗三枚正牌（钥匙/糖/自白）+ 适量干扰项
#
# 两条主线矛盾（定稿）：
#   ① 他的"过近"：真实=焦虑，想确认、想让距离很近（遮掩形态=控制欲，写作中不直说）
#     表现=频繁找她、秒回、在意她动态
#     她的前期理解（糖）=他很有爱：家里给了很多爱、会健康地去爱人的人
#     她的后期理解（幕8现场，不入库）=烦人、不给空间、控制欲强
#   ② 她的"过远"：真实=恐惧深层关系，想保持距离
#     表现=回得慢、放鸽子、对谁都热闹
#     他的前期理解（糖）=独立、开朗
#     他的后期理解（幕8现场，不入库）=冷漠、只对其他人热情
#
# 合法跨线通道（对话隔离的唯一例外）：
#   AI 永不跨窗；但角色之间可以说话。角色当面/微信里对彼此说的话，
#   可以由听到的一方转述进自己的窗，成为本窗的记忆证据。
#   例：她对他说「我可能不太会谈恋爱」→ 他转述进男窗（男窗钥匙）；
#       他对她说「我半夜还在刷你朋友圈」→ 她转述进女窗（女窗钥匙）。
#
# 正牌清单（每窗三枚，缩略标签=玩家可见的中性短语，类型为开发侧信息）：
#   男窗：钥匙「不会谈恋爱」=她说她可能不太会谈恋爱（5.4.11）
#         糖「都会回」=她回得慢但都会回（5.1.111）
#         自白「八百条在干嘛」=一天能给她发八百条'在干嘛'（5.1.1111）
#   女窗：钥匙「半夜刷朋友圈」=他说有次我半夜还在刷你朋友圈（5.2.111）
#         糖「家里有爱」=他是不是家里给了特别多爱才这么会关心人（5.2.111）
#         自白「怕太深入」=我就是怕太深入，一深入就搞砸（5.4.1）
#   干扰项（每窗2枚，生活趣闻，无性格指向）：
#   男窗：「猫叫煤球」（5.1.111）、「想吃烤肉」（5.2.111）
#   女窗：「同桌是表妹」（5.2.1）、「头像是小熊」（5.1.11）
#
# 存储形式：缩略标签（浏览层）+ 原文逐字引用（点开层）。
# 判定：8.5 认识到=持有本窗钥匙，缺则灰显提示；外归因永远可选（有糖则引用）；
# 自白不判分，只加深认识到台词。槽位分窗独立，不跨窗共享。
# 撤下候选的句子不删戏，降为叙事纹理（伏笔仍在，不再带◆标记）。
# ============================================================

