  # 女生第二轮。三家店都汇合到这一拍。回复说完这一侧先停。
  - id: R2
    channel: right
    time: 出门前·确认地址与准备
    lines:
      - from: girl
        text: 你说我要不要化妆，现在时间有点小紧张，但是好像有不认识的人来
        delivery: type
      - from: ai
        text: 她在意第一次见不认识的人，又怕耽误出门。可以建议她简单化一点，或者直接出门，把时间留给路上。
        delivery: thought
    choices:
      - thought: 简单化一点
        reply: 想化的话就简单弄一下，底妆和口红挑你平时最快的来。给路上留够时间，出门前不用把全套都做完。
        set: { 化妆: 化 }
      - thought: 先出门，不耽误时间
        reply: 来不及就先走吧。桌游局有现成的话题，到了坐下来就能一起玩。省下几分钟，路上也不用那么赶。
        set: { 化妆: 不化 }
