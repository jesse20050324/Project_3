    name: AI

beats:
  - id: L1
    channel: left
    time: 出门前·选店
    lines:
      - from: boy
        text: 我朋友叫我去玩桌游，但是没定好去哪家，你帮我看一下，市中心有啥推荐的
        delivery: type
      - from: ai
        text: 他和朋友还没定地点，只说想在市中心找。可以给几家差别明显的店，把位置和适合什么样的局说清楚，方便他们选。
        delivery: thought
    choices:
      - thought: 比较几家合适的桌游店
        reply: |-
          我给你列三家。要是人多，可以优先问有没有大桌或包间。

          时光桌游吧：位于小寨华旗国际A座，电话 029-85418760。是小寨片区比较老牌的桌游吧，但是环境一般，价格偏高。

          心动桌游俱乐部：在莱安中心T6-21703室。环境更新、店面更大，很多带独立包间，适合6人以上的大聚会。

          叙事者营地桌游馆：位于大唐不夜城长安C位10号商铺，在景区里，过去得多留点时间。
        next: L2

  - id: L2
    channel: left
    time: 出门前·选店
    lines:
      - from: boy
        text: 你帮我选一下吧，你帮我选一个。我们可能人稍微多一点。我在收拾东西呢，没时间看。
        delivery: type
      - from: ai
        text: 他正在收拾东西，想直接定一家，人可能还不少。选好后提醒他先问有没有能坐下的桌，免得一群人白跑一趟。
        delivery: thought
    choices:
      - thought: 时光桌游吧
        reply: |-
          可以先问这家。时光桌游吧，小寨华旗国际A座，电话 029-85418760。小寨老牌桌游吧，环境一般、价格偏高。
          你们人多，出门前先问一声有没有大桌或包间，定好再把地址发给大家。
        set:
          shop: 时光桌游吧
        next: L3
      - thought: 心动桌游俱乐部
        reply: |-
          可以先问这家。心动桌游俱乐部，莱安中心T6-21703室，电话 029-85512345。环境新、店面大，带独立包间，适合6人以上大聚会。
          你们人多，出门前先问一声有没有大桌或包间，定好再把地址发给大家。
        set:
          shop: 心动桌游俱乐部
        next: L3
      - thought: 叙事者营地桌游馆
        reply: |-
          可以先问这家。叙事者营地桌游馆，大唐不夜城长安C位10号商铺，电话 029-85678901。在景区里，有特色，但公共交通相对没那么方便。
          你们人多，出门前先问一声有没有大桌或包间，定好再把地址发给大家。
        set:
          shop: 叙事者营地桌游馆
        next: L3

  - id: L3
    channel: left
    time: 出门前·选店
    lines:
      - from: boy
        text: OK
        delivery: pop

