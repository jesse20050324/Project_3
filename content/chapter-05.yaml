        delivery: thought
    choices:
      - thought: 给出邀约话术
        reply: 不急，都聊一周了。直接说"周六有空吗，我知道一家店评价不错，带你去尝尝"，具体时间加具体事，比干问"有空吗"强十倍。
        next: 5m.2.11

