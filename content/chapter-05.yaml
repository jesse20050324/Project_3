        next: 5m.1.11

  - id: 5m.1.11
    channel: left
    lines:
      - from: boy
        text: 我发了！她过了四十多分钟才回，回了个'记得，你也要到点睡了'。这算不算冷淡啊，我盯着屏幕不知道咋接了
        delivery: type
      - from: ai
        text: 用户开始用回复间隔衡量态度，过度解读初现。需要说明对方可能在忙，同时给出具体回法。
        delivery: thought
    choices:
      - thought: 安抚用户并给出回法
        reply: 四十分钟不算冷淡，人家有自己的事。这句还关心你睡不睡呢。回"还没呢，刚聊上正兴奋"，接住就行。
        next: 5m.1.111

  - id: 5m.1.111
    channel: left
    记忆候选:
      - { 缩略标签: 都会回, 短句: "她回得慢但都会回", 类型: 糖, 线: ②她的回避 }
      - { 缩略标签: 猫叫煤球, 短句: "她的猫踩着键盘抢镜，叫煤球", 类型: 干扰项, 线: 无 }
    lines:
      - from: boy
        text: 我们连着聊三天了，她回得慢但都会回。今天她还主动给我发了张加班的照片，配了个'困'字，她的猫踩着键盘抢镜，叫煤球。我回啥
        delivery: type
      - from: ai
        text: 对方主动分享日常是升温信号。用户那句"回得慢但都会回"是他自己贴的第一张糖。需要让用户把"困"接住，表达关心但不过火。
        delivery: thought
    choices:
      - thought: 顺着照片关心一下
        reply: 主动发照片是好事，她想让你看到她的状态。回"困就早点收工，别熬秃了"，再夸夸猫，聊猫最安全，关心到点上，再多就腻了。
        next: 5m.1.1111

  - id: 5m.1.1111
    channel: left
    记忆候选:
      - { 缩略标签: 八百条在干嘛, 短句: "一天能给她发八百条'在干嘛'", 类型: 自白, 线: ①他的焦虑 }
    lines:
      - from: boy
        text: 我现在一天能给她发八百条'在干嘛'，她有时候隔俩小时才回。发完我就盯着她朋友圈刷，我是不是有点上头了
        delivery: type
      - from: ai
        text: 用户第一次把焦虑说出口：发八百条、刷朋友圈、怕自己上头。这是他真实的样子，他自己也刚看见。需要肯定觉察，给减频建议，别吓着他。
        delivery: thought
    choices:
      - thought: 肯定觉察，建议降低频率
        reply: 能意识到就还不算上头。试试一天两三条，挑她方便的时候发。你越从容，聊得反而越舒服。
        next: 5m.2.1

  # ---------- 男生 · 5.2 第一次见面 ----------
  - id: 5m.2.1
    channel: left
    lines:
      - from: boy
        text: 光线上聊不行了，我想约她出来吃个饭，周六。你说咋开口，会不会显得我很急
        delivery: type
      - from: ai
