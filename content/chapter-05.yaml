# 第五幕 · 熟悉期——由 script/ch5.yaml（轮次设计稿 v3）迁移而来
# 迁移说明：
#   编号映射：script 里两窗编号相同，引擎 id 加前缀区分——5m.x.y=男生窗 5.x.y，5f.x.y=女生窗 5.x.y。
#   入场三变体（5m.1.1-A/B/C、5f.1.1-A/B/C）是根拍，无 next 指向：
#     靠 when 旗标（男生意向/女生意向，幕4 4.2.2/4.3.3 设置）自动选一，落选变体永不放行。
#     双不问（两边都选了不问）没有任何变体可放行——游戏止于幕4"先到这里"，分支内容待定稿。
#   教学记忆清空：六个入场变体各挂 清空记忆（left/right），本窗开场拍完成即清空本窗教学记忆。
#   幕5 只做记忆产出，判定挂幕8.5：本幕没有 需记忆 选项；正牌3枚+干扰项2枚，标签不显示类型。
#   出口：5m.4.11 与 5f.4.11 各 set 在一起: true（幕6+7 待写，之后接结局）。
#   跨线时序：女5.2.1等男5.2.1、女5.2.11等男5.2.11、女5.4.1等男5.4.11（requires 实现）。
#   原文校对：script 5f.4.1 用户消息原为句号分隔（怕太深入。我一跟…），
#     为满足"记忆候选短句一字不差"校验，本文件按短句的逗号版本落字。
#   撤下候选的句子不删戏：慢回、放鸽子、省心等纹理保留在台词里，不带记忆候选。

