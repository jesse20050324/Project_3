  # ---------- 男生 · 5.1 开场三变体 ----------
  - id: 5m.1.1-A
    channel: left
    when: { 男生意向: 问, 女生意向: 问 }
    清空记忆: left
    lines:
      - from: boy
        text: 我妹刚跟我说，那个女生昨天也找她要过我的微信！我靠，我俩这是想到一块去了？那第一句我发啥才不尬，你说
        delivery: type
      - from: ai
        text: 用户得知对方也主动要过联系方式，情绪明显上头。需要趁热给个具体开场句，顺带提醒别用力过猛。
        delivery: thought
    choices:
      - thought: 给一句自然开场
        reply: 人家对你也有印象，稳了。直接发"hi，我是那天桌游的XX"，别整开场白，越随意越自然。
        next: 5m.1.11

  - id: 5m.1.1-B
    channel: left
    when: { 男生意向: 问, 女生意向: 不问 }
    清空记忆: left
    lines:
      - from: boy
        text: 微信搞到手了，我妹那个同桌的。但我盯着输入框半小时了，第一句发啥啊，'你好'像上门查水表的
        delivery: type
      - from: ai
        text: 用户要到了微信却卡在第一句。需要给具体话术，顺便降低他的心理负担。
        delivery: thought
    choices:
      - thought: 给一句自然开场
        reply: 别写你好，太正式。就发"hi，那天桌游我旁边那个，还记得不"，有记忆点又不用力。
        next: 5m.1.11

  - id: 5m.1.1-C
