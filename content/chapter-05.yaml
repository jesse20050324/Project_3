    when: { 男生意向: 不问, 女生意向: 问 }
    清空记忆: left
    lines:
      - from: boy
        text: 出大事了，我还没鼓起勇气去要微信呢，她直接加我了！是不是我妹出卖了我？她啥意思啊这是
