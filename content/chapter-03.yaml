      - thought: 鼓励玩家，主动一点
        reply: 那就在游戏里找机会，凑一句"带我一个呗"。桌游本来就是拿来破冰的，比干看着强。
        next: 3.3.2

  - id: 3.3.2
    channel: left
    lines:
      - from: boy
        text: 唉算了，我就是口嗨，我们桌游开始了不聊了。
        delivery: type
      - from: ai
        text: 用户给自己找了个台阶退场，语气是自我保护式的。顺着收住即可。
