    channel: right
    requires: [3.4.1]
    when: { 化妆: 不化 }
    lines:
      - from: girl
        text: 你帮我看一下这个衣服是什么牌子？ARTX，贵不贵？对了，妆没化，听你的，反正桌游店光线暗
