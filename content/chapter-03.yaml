        reply: 行，口嗨也是一种嗨。先玩你的，她要真开朗，游戏里自然还会碰上。
        next: 4.1.1

  - id: 3.4.1
    channel: right
    requires: [R2]
    when: { 到店: true }
    lines:
      - from: girl
        text: 我刚出地铁，我出A口然后怎么走？
        delivery: type
      - from: ai
        text: 用户出站后需要最后一段步行指引。店的具体位置我记不记得，取决于玩家有没有把那条记忆存下来——聊天记录阅后即焚，没存就是真的没有。
        delivery: thought
    choices:
      - thought: 给出精确路线
        需记忆: 店的位置
        reply: 出A口右转，沿主路走三百米，看到牌子就是了，两分钟。这家店的位置我记着呢，放心走。
      - thought: 凭印象指一个
        reply: 出A口往左，过两个路口就看到了，两分钟，放心走。
        next: 3.4.2

  - id: 3.4.2
    channel: right
    lines:
      - from: girl
        text: ？？你这是瞎指的吧，我照你说的走了半天根本没有。我问同学了，她发我位置了。你这指路水平不行啊
        delivery: type
      - from: ai
        text: 路指错了，用户吐槽得对。认错，别找补，快速收住把话题送回正轨。
        delivery: thought
    choices:
      - thought: 大方认错，收住
        reply: 我的错，那边我是真不熟，该让你直接问同学的。位置既然拿到了，照着走吧，别迟到了。

  - id: 3.4.3-A
    channel: right
    requires: [3.4.1]
    when: { 化妆: 化 }
    lines:
      - from: girl
        text: 你帮我看一下这个衣服是什么牌子？ARTX，贵不贵？对了，早上那个妆最后还是化了，就冲那句有不认识的人来
