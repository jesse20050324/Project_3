  - id: 3.4.4
    channel: right
    lines:
      - from: girl
        text: 啊这么贵啊，没事我就随便问问
        delivery: type
      - from: ai
        text: 用户被价格吓了一跳，又立刻找补。赴局前问衣服，多半是在意今天的状态，但她不想展开。不追问，顺着收。
        delivery: thought
    choices:
      - thought: 顺着她收住
        reply: 行，随便问问也是一种购物方式。衣服是给别人看的，局是给自己玩的，人到就行。
        next: 4.3.1
