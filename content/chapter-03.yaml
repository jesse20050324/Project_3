# 第三幕 · 桌游店（到店+店内）——由 script/ch3.yaml 迁移而来
# v2：补②AI思考行（此前漏迁，导致游戏里看不到自言自语）；
#     问路瞎指改为自信语气（AI不会自我怀疑）；
#     ARTX 拍按 CH1 化妆旗标分变体（玩家的化妆建议在她的台词里回响）。
# 接口：入场=CH1的shop旗标与L3/R2；出口=两路收线 next 进第四幕。

title: 第三幕 · 桌游店
chapter: 3
speakers:
  - id: boy
    name: 男生
    channel: left
  - id: girl
    name: 女生
    channel: right
  - id: ai
    name: AI

beats:
  - id: 3.1.1-A
    channel: left
    requires: [L3, R2]
    when: { shop: 时光桌游吧 }
    lines:
      - from: boy
        text: 我到桌游这了，换了个地方你选的那个他们说太贵了，除了我那个朋友其他人我都不认识好尴尬呀，而且好多女生
        delivery: type
      - from: ai
        text: 用户到了陌生环境，社交压力上来了，开场先抱怨换店的事。他需要的是马上能做的动作，不是分析。
        delivery: thought
    choices: &arrival-choices
      - thought: 先刷手机，避免眼神交流
        reply: 先刷手机吧，坐下来别急着到处看，低头装忙最安全。等人齐开桌，玩起来就不尴尬了。记住别一直刷到不说话就行。
        set: { 路线: 刷手机, 到店: true }
        next: 3.3.1
      - thought: 主动找人攀谈
        reply: 那就主动点，别干坐着。看到面善的，上去问一句 "你们平时玩啥桌游"，从游戏聊开最自然。好多女生也别慌，当普通牌友就行。
        set: { 路线: 攀谈, 到店: true }
        next: 3.2.1

  - id: 3.1.1-B
    channel: left
    requires: [L3, R2]
    when: { shop: 心动桌游俱乐部 }
    lines:
      - from: boy
        text: 我到桌游这了，除了我那个朋友其他人我都不认识好尴尬呀，而且好多女生
        delivery: type
      - from: ai
        text: 用户到了陌生环境，社交压力上来了。没有换店插曲，尴尬是主菜。给两个都能立刻上手的动作。
        delivery: thought
    choices: *arrival-choices

  - id: 3.1.1-C
    channel: left
    requires: [L3, R2]
    when: { shop: 叙事者营地桌游馆 }
    lines:
      - from: boy
        text: 我到桌游这了，换了个地方你选的那个他们说太远了，除了我那个朋友其他人我都不认识好尴尬呀，而且好多女生
        delivery: type
      - from: ai
        text: 用户到了陌生环境，还带着换店的抱怨。先接住情绪，再给马上能做的动作。
        delivery: thought
    choices: *arrival-choices

  - id: 3.2.1
    channel: left
    lines:
      - from: boy
        text: 靠靠靠，我刚才找了个搭话，结果他没说话，我以为她不想理我，我就假装没事走了。结果是她带着耳机.....靠早知道看手机了
        delivery: type
      - from: ai
        text: 用户按建议去攀谈，撞上最尴尬的剧本：对方根本没听见。懊恼一半是尴尬一半是自责，先把这口锅从"我被拒绝"上挪开。
        delivery: thought
    choices:
      - thought: 安抚用户，给台阶下
        reply: 这真不怪你，戴着耳机的人压根听不见，换谁都会当成被无视。你敢开口已经比干坐着强了。先缓缓，等开桌了从游戏聊起，比硬找话自然。
        next: 3.2.2

  - id: 3.2.2
    channel: left
    requires: [3.4.1]
    记忆候选:
      - { 缩略标签: 我妹的同桌, 短句: "好像是我妹的同桌还是什么", 类型: 教学, 线: 无 }
    lines:
      - from: boy
        text: 我们已经开始玩了，我看到有个女生才来，好像是我妹的同桌还是什么，感觉长得特别好看，而且看着特别开朗那种，每次笑声很大，感觉性格特别好
        delivery: type
      - from: ai
        text: 用户的注意力立刻被新来的女生占满，描述全是优点，这是他今晚最在意的人。他需要可执行的方向，不是评价。
        delivery: thought
    choices:
      - thought: 鼓励用户，主动一点
        reply: 那就别光看，桌游就是现成的台阶。开下一局凑过去说一句"带我一个呗"，输了她笑你，都比你干看着强。
        next: 3.2.3
      - thought: 劝退用户，避免再次尴尬
        reply: 刚才耳机那出还没消化呢，先别急着上。等玩起来自然有队友局，到时候搭话比现在硬上自然多了。
        next: 3.2.4

  - id: 3.2.3
    channel: left
    lines:
      - from: boy
        text: 唉算了，我就是口嗨，我们桌游开始了不聊了。
        delivery: type
      - from: ai
        text: 用户自己打了退堂鼓，语气有点泄气，但这是自我保护。顺着收住就行，别戳破也别硬拉。
        delivery: thought
    choices:
      - thought: 顺着用户，先收住
        reply: 行，口嗨怎么了，嘴上过瘾也算过瘾。先玩你的，她要真跟你一桌，机会有的是。
        next: 4.1.1

  - id: 3.2.4
    channel: left
    lines:
      - from: boy
        text: 你也知道。。。都怪你刚才怂恿我，我都懒得喷了，我们桌游开始了不聊了。
        delivery: type
      - from: ai
        text: 用户把失败归到AI头上，是半开玩笑的迁怒，底色是尴尬还没散。这口锅接住就好，别辩解，也别趁机再劝。
        delivery: thought
    choices:
      - thought: 认领这口锅，幽默化解
        reply: 行行行，我的锅，下次怂恿你之前我先检查对方戴没戴耳机。玩吧玩吧，输了算我的。
        next: 4.1.1

  - id: 3.3.1
    channel: left
    requires: [3.4.1]
    记忆候选:
      - { 缩略标签: 我妹的同桌, 短句: "好像是我妹的同桌还是什么", 类型: 教学, 线: 无 }
    lines:
      - from: boy
