  - 5m.4.2
  - 5m.4.3
  - 5f.4.1
  - 5f.4.2
  - 5f.4.3
  - 5m.4.4
  - 5f.4.4

# ------------------------------------------------------------
# 区间门（由剧本「接口确认.节拍对位」三条自然语言转写为机器可读约束）
# 语义：下界数组中至少一拍已完成；上界数组中任何一拍都还没有完成。
#       上界一旦完成，本拍仍在待播状态 = 区间越界，启动校验与仿真会报错。
# 这是「男第 3~10 条之间女第 6 条都成立、超了逻辑就出错」的实现。
# ------------------------------------------------------------
区间:
  - 说明: 女方主动联系在男方白天复盘之后、D9 之前
    拍: [5f.1.2]
    下界: [5m.1.4, 5m.1.5]
    上界: [5m.2.1]
  - 说明: 女5.1.3-5.1.5 与男5.1.6-5.2.1 区间重叠、先后自由
    拍: [5f.1.3, 5f.1.4, 5f.1.5]
    下界: [5m.1.6]
    上界: [5m.2.1]
  - 说明: 女5.2.1-5.2.4 落在男5.2.3/5.2.4-男5.3.1 区间内
    拍: [5f.2.1, 5f.2.2, 5f.2.3, 5f.2.4]
    下界: [5m.2.3, 5m.2.4]
    上界: [5m.3.1]
  - 说明: 男方收到女方实际入场路线的首句
    拍: [5m.1.3]
    下界: [5f.1.1-A, 5f.1.1-B, 5f.1.1-C]
    上界: [5f.1.2]
  - 说明: 男方任一表白路线发出后，女方收到并求助
    拍: [5f.4.1]
    下界: [5m.4.2, 5m.4.3]
    上界: []
  - 说明: 女方任一答复路线发出后，男方收到并回信
    拍: [5m.4.4]
    下界: [5f.4.2, 5f.4.3]
    上界: [5f.4.4]

# ------------------------------------------------------------
# 教学记忆收口（实现层决策）
# 剧本源没有「清空记忆」字段，教学记忆由引擎在第五幕开场收口。
# 引擎侧的世界观约定（AGENTS.md 核心设定），不写进剧本源。
# ------------------------------------------------------------
清空教学记忆:
  - 5m.1.1-A
  - 5m.1.1-B
  - 5m.1.1-C
  - 5f.1.1-A
  - 5f.1.1-B
  - 5f.1.1-C

# ------------------------------------------------------------
# 终局声明：双窗共同抵达才成立（幕6 未写，先落为可展示的结束态）
# ------------------------------------------------------------
终局:
  在一起:
    标题: 在一起
    需要: [5m.4.4, 5f.4.4]
    旗标: { 在一起: true }

# ------------------------------------------------------------
# 逐消息节拍（三层：全局预设 → 拍级默认 → 逐句/逐选项覆盖）
# 预设名见 src/presentation.ts：极快 / 快 / 正常 / 慢 / 长停顿。
# 也可以直接写数值对象覆盖单个字段，例如 { pauseBeforeMs: 1800 }。
# 键格式：拍表用引擎 id；句表用 "id:行号"（0=①用户消息，1=②AI思考）；
#        选项表用 "id:选项号"。
# ------------------------------------------------------------
节拍:
  拍:
    5m.1.3: 慢            # 「过了四十来分钟才回」——等待感
    5f.1.3: 慢            # 她下班攒了一堆没回
    5f.1.4: 慢
    5f.1.5: 慢
    5m.2.2: 快            # 一天八百条，语速密
    5m.4.2: 长停顿        # 输入中、停止、再输入
    5m.4.3: 长停顿
    5m.4.4: 慢
    5f.4.1: 慢
    5f.4.2: 长停顿        # 盯着那句话看了十分钟
    5f.4.3: 长停顿
    5f.4.4: 慢
  句:
    5m.1.2:0: { pauseBeforeMs: 1500 }   # 他对着输入框抠了半小时
    5f.4.4:0: { pauseBeforeMs: 1800 }   # 手一直在抖，像交卷
    5m.4.4:0: { pauseBeforeMs: 1200 }   # 她过了半小时才回
  选项:
    5m.4.1:0: { afterMs: 1600 }         # 表白稿打完，留一口气
    5f.4.1:0: { afterMs: 1600 }
# 玩家仍会读到这两句原文，只取消可存高亮。
停用记忆候选: [猫叫煤球, 头像是小熊]
