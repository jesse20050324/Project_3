# ============================================================
# 第五章「实现层 overlay」——剧本源里没有、但引擎需要的实现决策
#
# 当前剧本源为 docs/剧本审稿/第五幕-上线定稿.yaml。
# 本文件只负责：全局播出顺序、区间门、逐消息节拍、入场旗标、
# 教学记忆收口、终局声明。改这些不会动到定稿一个字。
# 由 tools/build-chapter.mjs 合并进 content/chapter-05.yaml。
#
# 想调节奏：改下面「节拍」三张表，或改 src/presentation.ts 的具名预设。
# 想改时序：改「拍序」与「区间」，跑 node tools/build-chapter.mjs --check 验证。
# ============================================================

标题: 第五幕 · 熟悉期
默认节拍: 正常

# 剧本「入场」三种取值 → 引擎 when 旗标（幕4 4.2.2 / 4.3.3 设置）
入场旗标:
  双问（男问+女问）: { 男生意向: 问, 女生意向: 问 }
  仅男问: { 男生意向: 问, 女生意向: 不问 }
  仅女问: { 男生意向: 不问, 女生意向: 问 }

# ------------------------------------------------------------
# 全局播出顺序（唯一排序真相）
# 由剧本顶层「时间轴」16 档 + 「接口确认.共享事件两窗一致」推得：
# 同档内按共享事件的因果排（例：D1 晚 f5.1.1 收到消息 → m5.1.3 才收到她的回复）。
# 两窗同号拍用 5m./5f. 前缀区分。分叉的互斥拍都列进来，只有被激活的那条会播。
# ------------------------------------------------------------
拍序:
  - 5m.1.1-A
  - 5m.1.1-B
  - 5m.1.1-C
  - 5m.1.2
  - 5f.1.1-A
  - 5f.1.1-B
  - 5f.1.1-C
